<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mic Telat Sholat</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f1f5f9;color:#0f172a}
h1{font-size:20px;margin:0 0 8px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 3px #0002;margin-bottom:12px}
button{font-size:18px;border:0;border-radius:14px;padding:14px 18px;width:100%;margin-top:8px;color:#fff}
#mic{background:#e11d48;font-size:22px;padding:22px}#mic.on{background:#1e293b}
#send{background:#4f46e5}#back{background:#64748b}
#status{margin:8px 0;font-size:15px}#interim{color:#64748b;min-height:1.2em}
textarea{width:100%;box-sizing:border-box;font-size:17px;min-height:120px;border-radius:12px;border:1px solid #cbd5e1;padding:10px}
.chips span{display:inline-block;background:#e0e7ff;border-radius:999px;padding:4px 10px;margin:3px;font-size:14px}
</style></head><body>
<h1>🎤 Sebut nama santri yang telat</h1>
<div class="card">
  <div id="prayer"></div>
  <button id="mic">🎤 Mulai Mic</button>
  <div id="status">Tekan Mulai Mic, izinkan mikrofon, lalu sebut nama. Pisahkan dengan "dan" atau jeda.</div>
  <div id="interim"></div>
</div>
<div class="card">
  <b>Hasil (bisa diedit):</b>
  <textarea id="out" placeholder="nama-nama akan muncul di sini"></textarea>
  <div class="chips" id="hint"></div>
  <button id="send">✅ Kirim ke Absensi</button>
  <button id="back">Kembali tanpa kirim</button>
</div>
<script>
const P={S:'Subuh',D:'Dzuhur',A:'Ashar',M:'Maghrib',I:'Isya'};
const h=new URLSearchParams(location.hash.slice(1));
const ret=h.get('ret')||'';const prayer=h.get('prayer')||'';
const okRet=/^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(ret);
document.getElementById('prayer').textContent=prayer&&P[prayer]?'Waktu sholat: '+P[prayer]+' (bisa diganti dengan menyebut "subuh", "ashar", dll.)':'';
const names=(h.get('names')||'').split('|').filter(Boolean);
const st=document.getElementById('status'),out=document.getElementById('out'),btn=document.getElementById('mic'),inter=document.getElementById('interim');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,on=false;
function add(t){t=t.trim();if(!t)return;out.value=(out.value?out.value+'\n':'')+t;}
function stop(){on=false;btn.classList.remove('on');btn.textContent='🎤 Mulai Mic';if(rec)try{rec.stop()}catch(e){}}
btn.onclick=function(){
  if(on){stop();st.textContent='Mic mati.';return;}
  if(!SR){st.textContent='⚠️ Browser ini tidak mendukung input suara. Buka halaman ini di Google Chrome.';return;}
  rec=new SR();rec.lang='id-ID';rec.continuous=true;rec.interimResults=true;
  rec.onresult=function(e){let i2='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)add(r[0].transcript);else i2+=r[0].transcript;}inter.textContent=i2;};
  rec.onerror=function(e){
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){stop();st.textContent='⚠️ Izin mikrofon ditolak. Ketuk ikon gembok di samping alamat → Izin → Mikrofon → Izinkan, lalu tekan Mulai Mic lagi.';}
    else if(e.error==='network'){stop();st.textContent='⚠️ Tidak ada internet untuk pengenalan suara.';}
    else if(e.error!=='no-speech'){st.textContent='⚠️ Error suara: '+e.error;}
  };
  rec.onend=function(){if(on){try{rec.start()}catch(e){}}};
  try{rec.start();}catch(e){st.textContent='⚠️ Gagal menyalakan mic: '+e.message;return;}
  on=true;btn.classList.add('on');btn.textContent='⏹ Stop Mic';st.textContent='🎙️ Mendengarkan... sebut nama santri';
};
function go(withText){
  stop();
  if(!okRet){st.textContent='⚠️ Alamat web absensi tidak valid. Buka halaman ini dari tombol mic di web absensi.';return;}
  let u=ret;if(withText&&out.value.trim()){u+='?voice='+encodeURIComponent(out.value.trim().slice(0,1800))+'&prayer='+encodeURIComponent(prayer);}
  location.href=u;
}
document.getElementById('send').onclick=function(){go(true)};
document.getElementById('back').onclick=function(){go(false)};
</script></body></html>
